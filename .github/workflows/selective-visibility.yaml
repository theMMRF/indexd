name: Selective visibility
on:
  pull_request:
  push:
    branches: [feature/selective-file-visibility, feature/selective-file-visibility-13.1]
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: indexd_tests
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      VISIBILITY_TEST_ES_URL: http://localhost:9200
      PROMETHEUS_MULTIPROC_DIR: /tmp/visibility-metrics
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: pip install poetry==2.3.3
      - run: poetry install --no-interaction
      - id: visibility
        run: poetry run pytest tests/visibility
      - if: ${{ !cancelled() && (steps.visibility.conclusion == 'success' || steps.visibility.conclusion == 'failure') }}
        run: poetry run pytest tests --ignore=tests/visibility
