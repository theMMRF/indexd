name: Publish reviewed image to ECR
on:
  push:
    tags: ['ecr-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ecr-${{ github.sha }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'theMMRF/indexd' && vars.ECR_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ecr-publish
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: mmrf/indexd
      ECR_REGISTRY: 438465164022.dkr.ecr.us-east-1.amazonaws.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the selected commit and tag
        id: source
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            [[ "$GITHUB_REF_NAME" == "ecr-$sha" ]] || {
              echo 'Use an ecr-<full commit SHA> tag pointing to that exact commit.' >&2
              exit 1
            }
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$sha" >> "$GITHUB_OUTPUT"
      - name: Authenticate to AWS using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4; matches ppmmrf
        with:
          role-to-assume: ${{ vars.ECR_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: '438465164022'
          role-session-name: gen3-ecr-${{ github.run_id }}
      - name: Check whether this immutable image already exists
        id: existing
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          if aws ecr describe-images --registry-id 438465164022 \
            --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=$SOURCE_SHA" \
            > "$RUNNER_TEMP/ecr-image.json" 2> "$RUNNER_TEMP/ecr-error.txt"; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo "digest=$(jq -r '.imageDetails[0].imageDigest' "$RUNNER_TEMP/ecr-image.json")" >> "$GITHUB_OUTPUT"
          elif grep -q 'ImageNotFoundException' "$RUNNER_TEMP/ecr-error.txt"; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/ecr-error.txt" >&2
            exit 1
          fi
      - name: Log in to Amazon ECR
        if: steps.existing.outputs.exists == 'false'
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2; matches ppmmrf
      - name: Set up Docker Buildx
        if: steps.existing.outputs.exists == 'false'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the exact checkout and publish
        if: steps.existing.outputs.exists == 'false'
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.source.outputs.image }}
          build-args: |
            GIT_COMMIT=${{ steps.source.outputs.sha }}
            GIT_VERSION=${{ steps.source.outputs.sha }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.source=https://github.com/theMMRF/indexd
      - name: Record the published image
        shell: bash
        env:
          IMAGE: ${{ steps.source.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest || steps.existing.outputs.digest }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo "Image: $IMAGE"
            echo "Digest: $DIGEST"
            echo "Source: $SOURCE_SHA"
            echo 'Published to ECR only. No GitOps update or cluster rollout was triggered.'
          } >> "$GITHUB_STEP_SUMMARY"
